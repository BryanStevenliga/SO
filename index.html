<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio de Sistemas Operativos - Gestión de Procesos</title>
  
  <!-- Tipografía moderna Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       VARIABLES Y PALETA DE COLOR TÉCNICA SOFISTICADA (ESMERALDA & CIAN NEÓN)
       ========================================================================== */
    :root {
      /* PALETA PREMIUM DARK MODE (#09090b a #18181b) */
      --bg-base: #09090b;
      --bg-surface: #121215;
      --bg-card: rgba(24, 24, 27, 0.65);
      --bg-card-hover: rgba(39, 39, 42, 0.65);
      --bg-subcard: rgba(18, 18, 21, 0.7);
      --bg-code: rgba(10, 10, 12, 0.85);

      /* BORDES ELEGANTES Y SUTILES */
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-medium: rgba(255, 255, 255, 0.14);
      --border-focus: rgba(255, 255, 255, 0.22);
      
      /* ACENTOS SOFISTICADOS (ÍNDIGO MODERNO Y ESMERALDA SUAVE) */
      --accent-primary: #6366f1;
      --accent-primary-subtle: rgba(99, 102, 241, 0.15);
      --accent-emerald: #10b981;
      --accent-emerald-subtle: rgba(16, 185, 129, 0.14);
      --accent-rose: #f43f5e;
      --accent-rose-subtle: rgba(244, 63, 94, 0.14);
      --accent-amber: #f59e0b;
      --accent-amber-subtle: rgba(245, 158, 11, 0.14);
      --accent-cyan: #38bdf8;
      --accent-cyan-subtle: rgba(56, 189, 248, 0.14);

      /* COMPATIBILIDAD CON VARIABLES PREVIAS */
      --neon-emerald: #10b981;
      --neon-emerald-glow: rgba(16, 185, 129, 0.2);
      --neon-cyan: #38bdf8;
      --neon-cyan-glow: rgba(56, 189, 248, 0.2);
      --neon-amber: #f59e0b;
      --neon-rose: #f43f5e;
      --neon-purple: #818cf8;
      --border-accent-emerald: rgba(16, 185, 129, 0.3);
      --border-accent-cyan: rgba(56, 189, 248, 0.3);

      /* TIPOGRAFÍA NÍTIDA PARA PANTALLA COMPARTIDA */
      --text-primary: #ffffff;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --text-dim: #52525b;

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace;

      --sidebar-width: 300px;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.6;
      display: flex;
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
    }

    /* FONDO SUTIL DARK PREMIUM (SIN DISTRACCIONES) */
    .bg-image-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 18% 12%, rgba(99, 102, 241, 0.04) 0%, transparent 50%),
                  radial-gradient(circle at 82% 88%, rgba(16, 185, 129, 0.03) 0%, transparent 50%),
                  var(--bg-base);
      z-index: 0;
      pointer-events: none;
    }

    .bg-overlay {
      display: none;
    }

    /* Scrollbars elegantes y minimalistas */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 6px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* ==========================================================================
       BARRA LATERAL DE NAVEGACIÓN GLASSMORPHISM
       ========================================================================== */
    .sidebar {
      position: sticky;
      top: 0;
      z-index: 20;
      width: var(--sidebar-width);
      background: rgba(15, 15, 18, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: 100vh;
      user-select: none;
    }

    .sidebar-header {
      padding: 1.8rem 1.6rem 1.4rem 1.6rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .sidebar-header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      line-height: 1.25;
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .nav-label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 1rem 0.8rem 0.4rem;
    }

    .nav-topic-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0.75rem 0.9rem;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      color: var(--text-secondary);
      text-align: left;
    }

    .nav-topic-card:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: var(--border-subtle);
      color: var(--text-primary);
    }

    .nav-topic-card.active {
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: var(--text-primary);
    }

    .nav-topic-num {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.76rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .nav-topic-card.active .nav-topic-num {
      background: var(--accent-primary);
      color: #ffffff;
    }

    .nav-topic-info {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    .nav-topic-title {
      font-size: 0.92rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-topic-sub {
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .nav-topic-card.active .nav-topic-sub {
      color: #c7d2fe;
    }

    .sidebar-footer {
      padding: 1.2rem 1.6rem;
      border-top: 1px solid var(--border-subtle);
      font-size: 0.76rem;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* ==========================================================================
       VIEWPORT PRINCIPAL
       ========================================================================== */
    .main-viewport {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    .top-header {
      position: sticky;
      top: 0;
      z-index: 30;
      padding: 1.1rem 2.4rem;
      background: rgba(15, 15, 18, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-badge {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border-subtle);
      padding: 4px 10px;
      border-radius: 6px;
    }

    .header-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .view-switcher {
      display: flex;
      background: rgba(24, 24, 27, 0.7);
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      gap: 3px;
    }

    .switch-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 0.88rem;
      font-weight: 500;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .switch-btn:hover {
      color: var(--text-primary);
    }

    .switch-btn.active {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border: 1px solid var(--border-subtle);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-arrow-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-arrow-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    .content-scroll-container {
      flex: 1;
      padding: 2rem 2.4rem 4rem 2.4rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .fade-enter {
      animation: fadeUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ==========================================================================
       PANEL Y TARJETAS GLASSMORPHISM CON EFECTO FOCO PRESENTADOR
       ========================================================================== */
    .glass-panel {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      transition: border-color 0.2s ease;
    }

    .glass-panel:hover {
      border-color: var(--border-medium);
    }

    .panel-header {
      padding: 1.25rem 1.8rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.02);
    }

    .panel-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .panel-icon-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-primary);
      font-size: 0.9rem;
      font-weight: 600;
      border: 1px solid var(--border-subtle);
    }

    .panel-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .panel-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .panel-body {
      padding: 1.8rem;
    }

    /* REJILLA DE TEORÍA CON FOCO DE PRESENTADOR */
    .theory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 1.5rem;
    }

    .theory-grid:hover .slide-card:not(:hover):not(.focused) {
      opacity: 0.45;
    }

    .slide-card {
      background: var(--bg-subcard);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1.8rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .slide-card:hover, .slide-card.focused {
      transform: translateY(-4px);
      border-color: var(--border-medium);
      background: var(--bg-card-hover);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      opacity: 1 !important;
      z-index: 5;
    }

    .slide-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .slide-tag {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .slide-num {
      font-family: var(--font-mono);
      font-size: 1rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.15);
    }

    .slide-heading {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.35;
    }

    .slide-text {
      font-size: 1.05rem;
      color: #a1a1aa;
      line-height: 1.65;
    }

    .slide-text strong {
      color: #ffffff;
      font-weight: 600;
    }

    .slide-text code {
      font-family: var(--font-mono);
      background: var(--bg-code);
      color: #e4e4e7;
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 0.9em;
      border: 1px solid var(--border-subtle);
    }

    /* ==========================================================================
       UX MODO LABORATORIO: BOTONES AUTO-DEMO GIGANTES PROTAGONISTAS
       ========================================================================== */
    .auto-demo-bar-hero {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      padding: 1.4rem 1.6rem;
      background: rgba(24, 24, 27, 0.5);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
    }

    .auto-demo-title-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .auto-demo-title-wrap h4 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .auto-demo-badge {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      padding: 3px 8px;
      border-radius: 5px;
      text-transform: uppercase;
    }

    .auto-demo-buttons-giant {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
    }

    .btn-giant-demo {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 1rem 1.3rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: rgba(39, 39, 42, 0.45);
      color: var(--text-primary);
      font-family: var(--font-sans);
      cursor: pointer;
      text-align: left;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-giant-demo:hover {
      background: rgba(45, 45, 52, 0.75);
      border-color: var(--border-medium);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .btn-giant-demo:active {
      transform: translateY(0);
    }

    .btn-giant-demo.secondary-cyan {
      border-color: var(--border-subtle);
      background: rgba(39, 39, 42, 0.45);
    }

    .btn-giant-demo.secondary-cyan:hover {
      background: rgba(45, 45, 52, 0.75);
      border-color: var(--border-medium);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .giant-demo-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      flex-shrink: 0;
      color: var(--accent-primary);
    }

    .btn-giant-demo.secondary-cyan .giant-demo-icon {
      color: var(--text-primary);
    }

    .giant-demo-texts {
      display: flex;
      flex-direction: column;
    }

    .giant-demo-title {
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .giant-demo-desc {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* INPUTS SECUNDARIOS EN SEGUNDO PLANO */
    .secondary-inputs-panel {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      padding: 1rem 1.4rem;
      background: rgba(8, 14, 28, 0.6);
      border-radius: var(--radius-sm);
      border: 1px dashed var(--border-subtle);
      margin-top: 1rem;
      opacity: 0.85;
      transition: opacity 0.2s ease;
    }

    .secondary-inputs-panel:hover {
      opacity: 1;
      border-style: solid;
      border-color: var(--border-medium);
    }

    .input-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .input-item label {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-field, .select-field {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border-subtle);
      color: #fff;
      padding: 0.5rem 0.8rem;
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 0.88rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-field:focus, .select-field:focus {
      border-color: var(--neon-emerald);
      box-shadow: 0 0 10px var(--neon-emerald-glow);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0.55rem 1.1rem;
      font-family: var(--font-sans);
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-emerald {
      background: rgba(16, 185, 129, 0.2);
      color: #a7f3d0;
      border-color: rgba(16, 185, 129, 0.4);
    }

    .btn-emerald:hover {
      background: rgba(16, 185, 129, 0.35);
      border-color: var(--neon-emerald);
      color: #fff;
    }

    .btn-cyan {
      background: rgba(56, 189, 248, 0.2);
      color: #a5f3fc;
      border-color: rgba(56, 189, 248, 0.4);
    }

    .btn-cyan:hover {
      background: rgba(56, 189, 248, 0.35);
      border-color: var(--neon-cyan);
      color: #fff;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      border-color: var(--border-subtle);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.2);
      color: #fecaca;
      border-color: rgba(239, 68, 68, 0.4);
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.35);
      border-color: var(--neon-rose);
      color: #fff;
    }

    /* KPIs NUMÉRICOS PARA ZOOM */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.2rem;
      margin-top: 1.4rem;
    }

    .kpi-card {
      background: rgba(11, 19, 36, 0.7);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
    }

    .kpi-title {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.4rem;
    }

    .kpi-number {
      font-family: var(--font-mono);
      font-size: 2.2rem;
      font-weight: 800;
      color: #fff;
      line-height: 1.2;
    }

    .kpi-subtext {
      font-size: 0.82rem;
      color: var(--text-dim);
      margin-top: 0.35rem;
    }

    /* TERMINAL DE AUDITORÍA */
    .audit-terminal {
      background: var(--bg-glass-code);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: var(--radius-sm);
      padding: 1.4rem;
      font-family: var(--font-mono);
      font-size: 0.95rem;
      color: #e2e8f0;
      margin-top: 1.4rem;
      line-height: 1.7;
    }

    .audit-header-tag {
      font-size: 0.75rem;
      color: var(--neon-emerald);
      text-transform: uppercase;

  <script>
    // --------------------------------------------------------------------------
    // BASE DE CONOCIMIENTO RIGUROSA: APUNTES FORMALES
    // (Integración de Componentes del Sistema: CPU, Memoria Principal, E/S, Almacenamiento)
    // --------------------------------------------------------------------------
    const THEORY_DATA = {
      9: {
        indicator: "Tema 9",
        title: "Procesos y Componentes del Sistema",
        cards: [
          {
            tag: "TEORÍA FUNDAMENTAL",
            num: "01",
            title: "El Proceso como Unidad de Trabajo Activa",
            body: "El <strong>proceso</strong> es la unidad de trabajo en cualquier sistema operativo moderno: es quien realiza las tareas de los usuarios y a quien se le asigna el tiempo de CPU y los recursos del sistema. A diferencia del <strong>programa</strong> (entidad pasiva almacenada en disco como archivo ejecutable), el proceso es una <strong>entidad activa</strong> cargada en la memoria principal. Dos usuarios ejecutando el mismo programa constituyen dos procesos distintos, pues cada uno mantiene su propio contador de programa (PC) y registros en CPU."
          },
          {
            tag: "ARQUITECTURA DE SISTEMA",
            num: "02",
            title: "Relación con la Memoria Principal y CPU",
            body: "La <strong>memoria principal</strong> es fundamental porque es el único almacenamiento al que la CPU tiene acceso directo. Para que las instrucciones de un proceso se ejecuten, o para operar con datos de almacenamiento secundario (disco o USB), deben copiarse antes a la memoria principal. El <strong>PCB (task_struct)</strong> almacena en memoria el descriptor del proceso: PID, Program Counter, banco de registros CPU y mapa de páginas virtuales. Los recursos se asignan al crearse y dinámicamente durante su ejecución."
          },
          {
            tag: "RESPONSABILIDADES DEL KERNEL",
            num: "03",
            title: "Ciclo de 5 Estados y Responsabilidades",
            body: "El componente de gestión de procesos del sistema operativo asume 5 responsabilidades centrales: <em>1. Crear y terminar procesos, 2. Suspender y reanudar, 3. Sincronización, 4. Comunicación IPC, 5. Tratamiento de interbloqueos</em>. Los estados formales son: <strong>Nuevo</strong> &rarr; <strong>Preparado</strong> &harr; <strong>Ejecutando</strong> &rarr; <strong>Esperando (E/S)</strong> &rarr; <strong>Terminado</strong>. Un proceso desbloqueado por E/S jamás ingresa directo a la CPU; siempre pasa a la cola de Preparados."
          }
        ]
      },
      10: {
        indicator: "Tema 10",
        title: "Planificación de la CPU",
        cards: [
          {
            tag: "TEORÍA FUNDAMENTAL",
            num: "01",
            title: "Alternancia de Ráfagas y Despachador",
            body: "El ciclo de ejecución de un proceso alterna ráfagas de cómputo en CPU y de espera de E/S. El <strong>Planificador de CPU</strong> decide qué proceso de la cola de Preparados toma el procesador para maximizar el aprovechamiento de la memoria principal y el rendimiento. El <strong>Despachador</strong> aplica el cambio de contexto guardando el PCB saliente y cargando el nuevo. La planificación puede ser <em>No Apropiativa</em> (cooperativa) o <em>Apropiativa</em> (desalojo por temporizador o prioridad)."
          },
          {
            tag: "MÉTRICAS FORMALES",
            num: "02",

        { pid: 103, state: "Esperando", pc: "0x00400810", cpuTime: 2, priority: 3 }

      stateT9.lastAction = "Auto-Demo: Suspensión por dispositivos periféricos de E/S";
      stateT9.auditMsg = "Dos procesos bloqueados en espera de interrupción de hardware.";

      renderView();
    }

    function actionT9_Admitir() {
      const pid = stateT9.nextPid++;
      stateT9.processes.push({ pid, state: "Preparado", pc: "0x00400000", cpuTime: 0, priority: 2 });
      stateT9.lastAction = `Admitir: Creado PID_${pid} en Preparado (Nuevo -> Preparado)`;
      stateT9.auditMsg = "Proceso cargado en memoria principal y descriptor PCB enlazado en cola de listos.";
      stateT9.auditAlert = null;
      renderView();
    }

    function actionT9_Despachar() {
      const running = stateT9.processes.find(p => p.state === "Ejecutando");
      const ready = stateT9.processes.find(p => p.state === "Preparado");
      if (!ready) {
        stateT9.lastAction = "Despacho rechazado: Cola de preparados vacía.";
        stateT9.auditAlert = "ERROR DE TRANSICIÓN: No hay procesos en cola de preparados. La CPU pasa a IDLE.";
        renderView();
        return;
      }
      if (running) running.state = "Preparado";
      ready.state = "Ejecutando";
      stateT9.contextSwitches++;
      stateT9.lastAction = `Despacho: PID_${ready.pid} pasa a Ejecutando`;
      stateT9.auditMsg = "Transición LEGAL. Se cargan registros de PID_" + ready.pid + " en los registros físicos de la CPU.";
      stateT9.auditAlert = null;
      renderView();
    }

    function actionT9_Quantum() {
      const running = stateT9.processes.find(p => p.state === "Ejecutando");
      if (!running) {
        stateT9.auditAlert = "ERROR: No hay ningún proceso en la CPU para desalojar.";
        renderView();
        return;
      }
      running.state = "Preparado";
      running.cpuTime += 2;
      stateT9.contextSwitches++;
      const next = stateT9.processes.find(p => p.state === "Preparado" && p.pid !== running.pid);
      if (next) {
        next.state = "Ejecutando";
        stateT9.lastAction = `Fin Quantum: PID_${running.pid} desalojado. PID_${next.pid} despachado.`;
      } else {
        running.state = "Ejecutando";
        stateT9.lastAction = `Fin Quantum: PID_${running.pid} reanuda (único proceso preparado).`;
      }
      stateT9.auditMsg = "Transición LEGAL: Desalojo apropiativo forzado por temporizador de reloj.";
      stateT9.auditAlert = null;
      renderView();
    }

    function actionT9_PedirIO() {
      const running = stateT9.processes.find(p => p.state === "Ejecutando");
      if (!running) {
        stateT9.auditAlert = "ERROR: Solo el proceso en ejecución puede invocar una llamada al sistema bloqueante de E/S.";
        renderView();
        return;
      }
      running.state = "Esperando";
      stateT9.contextSwitches++;
      const next = stateT9.processes.find(p => p.state === "Preparado");
      if (next) next.state = "Ejecutando";
      stateT9.lastAction = `Petición E/S: PID_${running.pid} bloqueado (Ejecutando -> Esperando)`;
      stateT9.auditMsg = "Transición voluntaria. Proceso aguarda fin de operación de disco o red.";
      stateT9.auditAlert = null;
      renderView();
    }

    function actionT9_FinIO() {
      const waiting = stateT9.processes.find(p => p.state === "Esperando");
      if (!waiting) {
        stateT9.auditAlert = "ERROR: No hay procesos en cola de Esperando.";
        renderView();
        return;
      }
      waiting.state = "Preparado";
      stateT9.lastAction = `Fin E/S: PID_${waiting.pid} pasa a Preparado`;
      stateT9.auditMsg = "Interrupción de periférico recibida. Proceso encolado en cola de listos.";
      stateT9.auditAlert = null;
      renderView();
    }

    function actionT9_Terminar() {
      const running = stateT9.processes.find(p => p.state === "Ejecutando");
      if (!running) {
        stateT9.auditAlert = "ERROR: Solo el proceso en ejecución puede invocar exit().";
        renderView();
        return;
      }
      running.state = "Terminado";
      const next = stateT9.processes.find(p => p.state === "Preparado");
      if (next) next.state = "Ejecutando";
      stateT9.lastAction = `Terminación: PID_${running.pid} ejecuta exit()`;
      stateT9.auditMsg = "Recursos de memoria principal reclamados por el sistema operativo.";
      stateT9.auditAlert = null;
      renderView();
    }

    function dispatchSpecificPid(pid) {
      const target = stateT9.processes.find(p => p.pid === pid);
      if (!target || target.state !== "Preparado") return;
      const running = stateT9.processes.find(p => p.state === "Ejecutando");
      if (running) running.state = "Preparado";
      target.state = "Ejecutando";
      stateT9.contextSwitches++;
      stateT9.lastAction = `Despacho selectivo: PID_${pid} toma la CPU.`;
      stateT9.auditAlert = null;
      renderView();
    }

    function unblockSpecificPid(pid) {
      const target = stateT9.processes.find(p => p.pid === pid);
      if (target && target.state === "Esperando") {
        target.state = "Preparado";
        stateT9.lastAction = `Interrupción E/S: PID_${pid} pasa a Preparado.`;
        stateT9.auditAlert = null;
        renderView();
      }
    }

    // ==========================================================================
    // TEMA 10: PLANIFICACIÓN DE CPU
    // ==========================================================================
    function calculateScheduleT10() {
      const procs = stateT10.processes.map(p => ({
        pid: p.pid,
        arrival: parseInt(p.arrival, 10),
        burst: parseInt(p.burst, 10),
        remaining: parseInt(p.burst, 10),
        start: -1,
        finish: 0,
        turnaround: 0,
        waiting: 0
      }));

      const alg = stateT10.algorithm;
      const q = parseInt(stateT10.quantum, 10) || 2;
      const gantt = [];
      let time = 0;
      let completed = 0;
      const n = procs.length;

      if (n === 0) {
        stateT10.evaluated = [];
        stateT10.gantt = [];
        return;
      }

      if (alg === "FCFS") {
        const sorted = [...procs].sort((a, b) => a.arrival - b.arrival);
        sorted.forEach(p => {
          if (time < p.arrival) {
            gantt.push({ pid: "IDLE", start: time, end: p.arrival, duration: p.arrival - time });
            time = p.arrival;
          }
          p.start = time;
          gantt.push({ pid: p.pid, start: time, end: time + p.burst, duration: p.burst });
          time += p.burst;
          p.finish = time;
          p.turnaround = p.finish - p.arrival;
          p.waiting = p.turnaround - p.burst;
        });
        stateT10.evaluated = sorted;
      } else if (alg === "SJF") {
        const finishedSet = new Set();
        while (completed < n) {
          const ready = procs.filter(p => p.arrival <= time && !finishedSet.has(p.pid));
          if (ready.length === 0) {
            gantt.push({ pid: "IDLE", start: time, end: time + 1, duration: 1 });
            time++;
            continue;
          }
          ready.sort((a, b) => a.burst - b.burst || a.arrival - b.arrival);
          const curr = ready[0];
          curr.start = time;
          gantt.push({ pid: curr.pid, start: time, end: time + curr.burst, duration: curr.burst });
          time += curr.burst;
          curr.finish = time;
          curr.turnaround = curr.finish - curr.arrival;
          curr.waiting = curr.turnaround - curr.burst;
          finishedSet.add(curr.pid);
          completed++;
        }
        stateT10.evaluated = procs;
      } else if (alg === "SRTF") {
        while (completed < n) {
          const ready = procs.filter(p => p.arrival <= time && p.remaining > 0);
          if (ready.length === 0) {
            if (gantt.length > 0 && gantt[gantt.length - 1].pid === "IDLE") {
              gantt[gantt.length - 1].end++;
              gantt[gantt.length - 1].duration++;
            } else {
              gantt.push({ pid: "IDLE", start: time, end: time + 1, duration: 1 });
            }
            time++;
            continue;
          }
          ready.sort((a, b) => a.remaining - b.remaining || a.arrival - b.arrival);
          const curr = ready[0];
          if (curr.start === -1) curr.start = time;

          if (gantt.length > 0 && gantt[gantt.length - 1].pid === curr.pid) {
            gantt[gantt.length - 1].end++;
            gantt[gantt.length - 1].duration++;
          } else {
            gantt.push({ pid: curr.pid, start: time, end: time + 1, duration: 1 });
          }

          curr.remaining--;
          time++;
          if (curr.remaining === 0) {
            curr.finish = time;
            curr.turnaround = curr.finish - curr.arrival;
            curr.waiting = curr.turnaround - curr.burst;
            completed++;
          }
        }
        stateT10.evaluated = procs;
      } else if (alg === "RR") {
        const queue = [];
        let pIndex = 0;
        const sortedArrival = [...procs].sort((a, b) => a.arrival - b.arrival);

        while (completed < n) {
          while (pIndex < n && sortedArrival[pIndex].arrival <= time) {
            queue.push(sortedArrival[pIndex]);
            pIndex++;
          }
          if (queue.length === 0) {
            gantt.push({ pid: "IDLE", start: time, end: time + 1, duration: 1 });
            time++;
            continue;
          }
          const curr = queue.shift();
          if (curr.start === -1) curr.start = time;
          const slice = Math.min(curr.remaining, q);
          gantt.push({ pid: curr.pid, start: time, end: time + slice, duration: slice });
          curr.remaining -= slice;
          time += slice;

          while (pIndex < n && sortedArrival[pIndex].arrival <= time) {
            queue.push(sortedArrival[pIndex]);
            pIndex++;
          }

          if (curr.remaining > 0) {
            queue.push(curr);
          } else {
            curr.finish = time;
            curr.turnaround = curr.finish - curr.arrival;
            curr.waiting = curr.turnaround - curr.burst;
            completed++;
          }
        }
        stateT10.evaluated = procs;
      }

      stateT10.gantt = gantt;
      const totalTurnaround = stateT10.evaluated.reduce((a, b) => a + b.turnaround, 0);
      const totalWaiting = stateT10.evaluated.reduce((a, b) => a + b.waiting, 0);
      const totalBurst = stateT10.processes.reduce((a, b) => a + parseInt(b.burst, 10), 0);

      stateT10.tmr = (totalTurnaround / n).toFixed(2);
      stateT10.tme = (totalWaiting / n).toFixed(2);
      stateT10.cpuUtil = time > 0 ? ((totalBurst / time) * 100).toFixed(1) + "%" : "100%";

      stateT10.hasConvoy = false;
      if (alg === "FCFS" && stateT10.evaluated.length >= 2) {
        const first = stateT10.evaluated[0];
        const othersAvgBurst = stateT10.evaluated.slice(1).reduce((a, b) => a + b.burst, 0) / (stateT10.evaluated.length - 1);
        if (first.burst >= 2 * othersAvgBurst && first.burst >= 6) {
          stateT10.hasConvoy = true;
        }
      }
    }

    function resetStateT11() {
      stateT11.mailbox = [];

      stateT11.p1State = "Activo";

    function demoT11_BloqueoVacio() {
      resetStateT11();
      stateT11.mode = "blocking";
      stateT11.capacity = 3;
      stateT11.mailbox = [];
      stateT11.p1State = "Activo";
      stateT11.p3State = "Activo";
      stateT11.auditMsg = "Buzón vacío. Próximo receive() suspenderá a P3 hasta la llegada de nuevos datos.";
      stateT11.auditAlert = "CONDICIÓN DE VACÍO ALCANZADA: Receptor suspendido esperando que un emisor ejecute send().";
      renderView();
    }

    function changeT11Mode(val) {
      stateT11.mode = val;
      stateT11.p1State = "Activo";
      stateT11.p3State = "Activo";
      stateT11.auditAlert = null;
      renderView();
    }

    function changeT11Cap(val) {
      stateT11.capacity = parseInt(val, 10);
      if (stateT11.mailbox.length > stateT11.capacity) {
        stateT11.mailbox = stateT11.mailbox.slice(0, stateT11.capacity);
      }
      renderView();
    }

    function sendT11(sender) {
      if (stateT11.mailbox.length >= stateT11.capacity) {
        if (stateT11.mode === "blocking") {
          stateT11.p1State = "Bloqueado";
          stateT11.auditMsg = `Buzón LLENO (${stateT11.capacity}/${stateT11.capacity}). ${sender} queda suspendido en la cola de espera del buzón.`;
          stateT11.auditAlert = `BLOQUEO SÍNCRONO: Emisor ${sender} suspendido hasta que P3 extraiga un mensaje.`;
        } else {
          stateT11.auditMsg = `Buzón LLENO. En modo Asíncrono, ${sender} recibe código de error EAGAIN sin suspenderse.`;
          stateT11.auditAlert = "RECHAZO ASÍNCRONO: Mensaje descartado por falta de espacio.";
        }
        renderView();
        return;
      }
      const id = "M" + (stateT11.mailbox.length + 1);
      stateT11.mailbox.push({ id, sender, text: `PAYLOAD_${Date.now()%1000}`, size: 256 });
      stateT11.totalCopies++;
      stateT11.p3State = "Activo";
      stateT11.auditMsg = `${sender} ejecutó send(). Mensaje ${id} copiado al espacio kernel (Copia 1: Usuario -> Kernel).`;
      stateT11.auditAlert = null;
      renderView();
    }

    function receiveT11() {
      if (stateT11.mailbox.length === 0) {
        if (stateT11.mode === "blocking") {
          stateT11.p3State = "Bloqueado";
          stateT11.auditMsg = "Buzón VACÍO. P3 queda suspendido hasta la llegada de un nuevo mensaje.";
          stateT11.auditAlert = "BLOQUEO SÍNCRONO: Receptor P3 suspendido esperando datos.";
        } else {
          stateT11.auditMsg = "Buzón VACÍO. En modo Asíncrono, P3 recibe NULL y continúa.";
          stateT11.auditAlert = null;
        }
        renderView();
        return;
      }
      const delivered = stateT11.mailbox.shift();
      stateT11.totalCopies++;
      stateT11.p1State = "Activo";
      stateT11.p3State = "Activo";
      stateT11.auditMsg = `P3 extrajo el mensaje ${delivered.id} en orden FIFO (Copia 2: Kernel -> Usuario).`;
      stateT11.auditAlert = null;
      renderView();
    }

      stateT12.buffer[stateT12.inPtr] = `ITEM_${stateT12.inPtr}`;
      stateT12.inPtr = (stateT12.inPtr + 1) % stateT12.size;
      stateT12.auditAlert = null;
      renderView();

        renderView();

      stateT12.buffer[stateT12.outPtr] = null;
      stateT12.outPtr = (stateT12.outPtr + 1) % stateT12.size;
      stateT12.auditAlert = null;
      renderView();

              </div>

              <div style="margin-top:1.2rem;">
                <div style="height:14px; background:rgba(255,255,255,0.1); border-radius:7px; overflow:hidden;">
                  <div style="height:100%; width:${Math.min((S / Smax) * 100, 100)}%; background:linear-gradient(90deg, var(--neon-emerald) 0%, var(--neon-cyan) 100%);"></div>
                </div>
                <div style="display:flex; justify-content:space-between; font-size:0.75rem; font-family:var(--font-mono); color:var(--text-dim); margin-top:4px;">
                  <span>0x</span>
                  <span>${S}x alcanzado</span>
                  <span>Límite ${Smax}x</span>
                </div>
              </div>
            </div>
          </div>

          <!-- KPIs -->
          <div class="kpi-row">
            <div class="kpi-card">
              <span class="kpi-title">Speedup S(N)</span>
              <span class="kpi-number" style="color:var(--neon-emerald);">${S}x</span>
              <span class="kpi-subtext">Aceleración sobre 1 núcleo</span>
            </div>
            <div class="kpi-card">
              <span class="kpi-title">Eficiencia Paralela</span>
              <span class="kpi-number" style="color:var(--neon-cyan);">${efficiency}%</span>
              <span class="kpi-subtext">Fórmula: (S / N) &times; 100</span>
            </div>
            <div class="kpi-card">
              <span class="kpi-title">Ahorro de Memoria RAM</span>
              <span class="kpi-number" style="color:var(--neon-emerald); font-size:1.8rem;">~90%</span>
              <span class="kpi-subtext">Frente a N procesos independientes</span>
            </div>
          </div>

          <!-- AUDITORÍA -->
          <div class="audit-terminal">
            <div class="audit-header-tag">Fórmula Formal de la Ley de Amdahl</div>
            <div><code>S(N) = 1 / ((1 - P) + (P / N))</code> &rArr; <code>1 / (${(1 - P).toFixed(2)} + (${P} / ${N})) = ${S}x</code>.</div>
            <div><strong>Conclusión de Rendimiento:</strong> Aunque añadas infinitos procesadores, la aceleración jamás superará <strong style="color:var(--neon-cyan);">${Smax}x</strong> debido a que el ${((1 - P) * 100).toFixed(0)}% del código es estrictamente secuencial.</div>
          </div>
        </div>
      `;
      container.appendChild(panel);
    }

    function demoT13_AltaParalelizacion() {
      stateT13.fractionP = 0.95;
      stateT13.threadsN = 16;
      renderView();
    }

    function demoT13_CuelloBotella() {
      stateT13.fractionP = 0.50;
      stateT13.threadsN = 16;
      renderView();
    }

    function changeT13P(val) {
      stateT13.fractionP = parseFloat(val);
      renderView();
    }

    function changeT13N(val) {
      stateT13.threadsN = parseInt(val, 10);
      renderView();
    }

    // ==========================================================================
    // TEMA 14: SINCRONIZACIÓN Y MUTEX
    // ==========================================================================
    function renderLabT14(container) {
      const steps = stateT14.useMutex ? microstepsWithMutex : microstepsWithoutMutex;
      const current = steps[Math.max(0, stateT14.stepIndex - 1)] || { count: 5, r1: 0, r2: 0 };
      const isCorrupt = !stateT14.useMutex && stateT14.stepIndex === 6;

      const panel = document.createElement('div');
      panel.className = 'glass-panel lab-compact';
      panel.innerHTML = `
        <div class="panel-header">
          <div class="panel-header-left">
            <div class="panel-icon-pill">14</div>
            <div>
              <h3 class="panel-title">Laboratorio: Sincronización, Condición de Carrera y Cerrojo Mutex</h3>
              <p class="panel-subtitle">Descomposición de count++ y count-- en microinstrucciones de ensamblador</p>
            </div>
          </div>
        </div>

        <div class="panel-body">
          <!-- AUTO-DEMOS GIGANTES -->
          <div class="auto-demo-bar-hero">
            <div class="auto-demo-title-wrap">
              <h4>
                <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                Escenarios Precargados (Auto-Demos en 1 Clic)
              </h4>
              <span class="auto-demo-badge">A prueba de fallos para Zoom</span>
            </div>

            <div class="auto-demo-buttons-giant">
              <button class="btn-giant-demo" onclick="demoT14_SinMutex()">
                <div class="giant-demo-icon">
                  <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                  </svg>
                </div>
                <div class="giant-demo-texts">
                  <span class="giant-demo-title">Demostrar Carrera SIN Mutex</span>
                  <span class="giant-demo-desc">Intercalación destructiva: count termina en 4 (debería ser 5)</span>
                </div>
              </button>

              <button class="btn-giant-demo secondary-cyan" onclick="demoT14_ConMutex()">
                <div class="giant-demo-icon">
                  <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                  </svg>
                </div>
                <div class="giant-demo-texts">
                  <span class="giant-demo-title">Demostrar Protección CON Mutex</span>
                  <span class="giant-demo-desc">Exclusión mutua garantizada: count finaliza consistente en 5</span>
                </div>
              </button>
            </div>
          </div>

          <!-- INPUTS SECUNDARIOS -->
          <div class="secondary-inputs-panel">
            <span class="mutex-lock-badge ${stateT14.useMutex ? 'mutex-locked' : 'mutex-unlocked'}">
              ${stateT14.useMutex ? 'MUTEX ACTIVADO' : 'MUTEX DESACTIVADO'}
            </span>
            <span style="font-family:var(--font-mono); font-size:0.85rem; color:var(--text-muted);">Paso actual: ${stateT14.stepIndex} / 6</span>
            <div style="display:flex; gap:8px; margin-left:auto;">
              <button class="btn btn-emerald" onclick="stepT14()">Paso a Paso &rarr;</button>
              <button class="btn btn-secondary" onclick="runAllT14()">Ejecutar Todo</button>
              <button class="btn btn-secondary" onclick="resetT14()">Reiniciar</button>
            </div>
          </div>

          <!-- DOS COLUMNAS DE CÓDIGO (HILO A vs HILO B) -->
          <div class="sync-split-code-view">
            <div class="thread-code-card" style="border-color:${current.thread === 1 ? 'var(--neon-emerald)' : 'var(--border-subtle)'};">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.8rem;">
                <span style="font-family:var(--font-mono); font-size:0.85rem; font-weight:700; color:var(--neon-emerald);">HILO 1 (count++)</span>
                <span class="badge badge-ready">Registro R1 = ${stateT14.r1}</span>
              </div>
              <div class="pcb-code-block">
<span style="color:#94a3b8;">// C++: count++</span>
${stateT14.useMutex ? '<span style="color:#86efac;">pthread_mutex_lock(&m);</span>\n' : ''}R1 = count;       <span style="color:#64748b;">// Carga en CPU</span>
R1 = R1 + 1;     <span style="color:#64748b;">// Incrementa</span>
count = R1;       <span style="color:#64748b;">// Escribe en RAM</span>
${stateT14.useMutex ? '<span style="color:#86efac;">pthread_mutex_unlock(&m);</span>' : ''}
              </div>
            </div>

            <div class="thread-code-card" style="border-color:${current.thread === 2 ? 'var(--neon-rose)' : 'var(--border-subtle)'};">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.8rem;">
                <span style="font-family:var(--font-mono); font-size:0.85rem; font-weight:700; color:var(--neon-rose);">HILO 2 (count--)</span>
                <span class="badge badge-error">Registro R2 = ${stateT14.r2}</span>
              </div>
              <div class="pcb-code-block">
<span style="color:#94a3b8;">// C++: count--</span>
${stateT14.useMutex ? '<span style="color:#86efac;">pthread_mutex_lock(&m);</span>\n' : ''}R2 = count;       <span style="color:#64748b;">// Carga en CPU</span>
R2 = R2 - 1;     <span style="color:#64748b;">// Decrementa</span>
count = R2;       <span style="color:#64748b;">// Escribe en RAM</span>
${stateT14.useMutex ? '<span style="color:#86efac;">pthread_mutex_unlock(&m);</span>' : ''}
              </div>
            </div>
          </div>

          <!-- KPIs -->
          <div class="kpi-row">
            <div class="kpi-card">
              <span class="kpi-title">Valor en RAM de count</span>
              <span class="kpi-number" style="color:${isCorrupt ? 'var(--neon-rose)' : 'var(--neon-emerald)'};">
                ${current.count}
              </span>
              <span class="kpi-subtext">${isCorrupt ? '¡CORRUPCIÓN DE MEMORIA!' : 'Valor teórico esperado: 5'}</span>
            </div>
            <div class="kpi-card">
              <span class="kpi-title">Exclusión Mutua</span>
              <span class="kpi-number" style="color:${stateT14.useMutex ? 'var(--neon-emerald)' : 'var(--neon-rose)'}; font-size:1.8rem;">
                ${stateT14.useMutex ? 'GARANTIZADA' : 'VIOLADA'}
              </span>
              <span class="kpi-subtext">${stateT14.useMutex ? 'Sección crítica protegida' : 'Intercalación destructiva'}</span>
            </div>
            <div class="kpi-card">
              <span class="kpi-title">Instrucciones Ejecutadas</span>
              <span class="kpi-number">${stateT14.stepIndex} / 6</span>
              <span class="kpi-subtext">Microinstrucciones despachadas</span>
            </div>
          </div>

          <!-- AUDITORÍA -->
          <div class="audit-terminal">
            <div class="audit-header-tag">Auditoría de Microinstrucciones en Memoria Principal</div>
            <div><strong>Paso Actual:</strong> ${stateT14.lastStepText}</div>
            ${isCorrupt ? `
              <div class="audit-alert-box">
                <strong>CONDICIÓN DE CARRERA CONFIRMADA:</strong> Debido a que el Hilo 2 leyó count (5) antes de que el Hilo 1 depositara su valor incrementado (6), la última escritura del Hilo 2 sobreescribió en la memoria RAM el valor 4. El incremento se perdió por completo.
              </div>
            ` : stateT14.useMutex && stateT14.stepIndex === 6 ? `
              <div class="audit-success-box">
                <strong>SINCRONIZACIÓN EXITOSA:</strong> El Mutex forzó la ejecución atómica de la sección crítica. El valor final en memoria principal es exactamente 5.
              </div>
            ` : `
              <div style="color:var(--text-muted); margin-top:0.4rem;">
                Avanza con el botón "Paso a Paso" para observar la carga y modificación en los registros R1 y R2.
              </div>
            `}
          </div>
        </div>
      `;
      container.appendChild(panel);
    }

    function resetStateT14() {
      stateT14.stepIndex = 0;
      stateT14.r1 = 0;
      stateT14.r2 = 0;
      stateT14.count = 5;
      stateT14.mutexLocked = false;
      stateT14.auditAlert = null;
      stateT14.lastStepText = "Secuencia reiniciada.";
    }

    function demoT14_SinMutex() {
      resetStateT14();
      stateT14.useMutex = false;
      stateT14.stepIndex = 6;
      stateT14.r1 = 6;
      stateT14.r2 = 4;
      stateT14.count = 4;
      stateT14.lastStepText = "Hilo 2 escribe count = 4. ¡Sobreescritura destructiva!";
      renderView();
    }

    function demoT14_ConMutex() {
      resetStateT14();
      stateT14.useMutex = true;
      stateT14.stepIndex = 6;
      stateT14.r1 = 6;
      stateT14.r2 = 5;
      stateT14.count = 5;
      stateT14.lastStepText = "Sección crítica ejecutada con exclusión mutua. RAM consistente (5).";
      renderView();
    }

    function stepT14() {
      if (stateT14.stepIndex < 6) {
        stateT14.stepIndex++;
        const steps = stateT14.useMutex ? microstepsWithMutex : microstepsWithoutMutex;
        const s = steps[stateT14.stepIndex - 1];
        stateT14.lastStepText = s.text;
        stateT14.r1 = s.r1;
        stateT14.r2 = s.r2;
        stateT14.count = s.count;
      }
      renderView();
    }

    function runAllT14() {
      stateT14.stepIndex = 6;
      const steps = stateT14.useMutex ? microstepsWithMutex : microstepsWithoutMutex;
      const s = steps[5];
      stateT14.lastStepText = s.text;
      stateT14.r1 = s.r1;
      stateT14.r2 = s.r2;
      stateT14.count = s.count;
      renderView();
    }

    function resetT14() {
      stateT14.stepIndex = 0;
      stateT14.r1 = 0;
      stateT14.r2 = 0;
      stateT14.count = 5;
      stateT14.lastStepText = "Secuencia reiniciada. count = 5 en memoria.";
      renderView();
    }

    // --------------------------------------------------------------------------
    // INICIALIZACIÓN
    // --------------------------------------------------------------------------
    document.addEventListener("DOMContentLoaded", () => {
      selectTopic(9);
    });
  </script>
</body>
</html>
