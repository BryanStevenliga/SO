<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistemas Operativos - Gestión de Procesos (Temas 9-14) | ULL ESIT</title>
  
  <!-- Tipografía moderna Google Fonts: Inter & JetBrains Mono para código -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       VARIABLES Y PALETA DE COLOR TÉCNICA PREMIUM (ESTILO APPLE / VERCEL)
       ========================================================================== */
    :root {
      --bg-dark: #080c14;
      --bg-card: rgba(15, 23, 42, 0.72);
      --bg-card-hover: rgba(22, 34, 60, 0.82);
      --bg-card-active: rgba(30, 48, 80, 0.85);
      --bg-surface: rgba(11, 17, 32, 0.8);
      --bg-subcard: rgba(13, 20, 36, 0.65);
      --bg-code: rgba(4, 8, 16, 0.9);
      
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-medium: rgba(255, 255, 255, 0.15);
      --border-accent: rgba(56, 189, 248, 0.35);

      --neon-cyan: #38bdf8;
      --neon-blue: #3b82f6;
      --neon-purple: #a855f7;
      --neon-emerald: #10b981;
      --neon-amber: #f59e0b;
      --neon-rose: #f43f5e;
      --neon-red: #ef4444;

      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace;

      --sidebar-width: 320px;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.6;
      display: flex;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Canvas de fondo 4K interactivo */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* Scrollbars modernos de bajo contraste */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(10, 15, 29, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(56, 189, 248, 0.4);
    }

    /* ==========================================================================
       SIDEBAR DE NAVEGACIÓN GLASSMORPHISM
       ========================================================================== */
    .sidebar {
      position: relative;
      z-index: 10;
      width: var(--sidebar-width);
      background: rgba(11, 17, 32, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: 100vh;
      user-select: none;
      box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
    }

    .sidebar-header {
      padding: 1.5rem 1.4rem;
      border-bottom: 1px solid var(--border-subtle);
      background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0) 100%);
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--neon-cyan);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 0.6rem;
    }

    .brand-badge::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--neon-emerald);
      box-shadow: 0 0 8px var(--neon-emerald);
      animation: pulse-dot 2s infinite ease-in-out;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .sidebar-header h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      line-height: 1.3;
    }

    .sidebar-header p {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .nav-label {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.5rem 0.6rem 0.2rem;
    }

    .nav-topic-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0.85rem 1rem;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      color: var(--text-secondary);
      text-align: left;
    }

    .nav-topic-card:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.1);
      color: #fff;
      transform: translateX(3px);
    }

    .nav-topic-card.active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.16) 0%, rgba(59, 130, 246, 0.12) 100%);
      border: 1px solid var(--border-accent);
      color: #fff;
      box-shadow: 0 4px 20px rgba(56, 189, 248, 0.15);
    }

    .nav-topic-num {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .nav-topic-card.active .nav-topic-num {
      background: var(--neon-cyan);
      color: #040810;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
    }

    .nav-topic-info {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    .nav-topic-title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-topic-sub {
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .nav-topic-card.active .nav-topic-sub {
      color: #7dd3fc;
    }

    .sidebar-footer {
      padding: 1.2rem 1.4rem;
      border-top: 1px solid var(--border-subtle);
      background: rgba(4, 8, 16, 0.6);
      font-size: 0.78rem;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-footer a {
      color: var(--neon-cyan);
      text-decoration: none;
    }

    /* ==========================================================================
       ÁREA PRINCIPAL DE CONTENIDO
       ========================================================================== */
    .main-viewport {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Header superior tipo Keynote */
    .top-header {
      padding: 1rem 2.2rem;
      background: rgba(11, 17, 32, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-badge {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 700;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 4px 12px;
      border-radius: 8px;
    }

    .header-title {
      font-size: 1.45rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
    }

    /* Selector de pestañas para Zoom */
    .view-switcher {
      display: flex;
      background: rgba(4, 8, 16, 0.85);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      gap: 4px;
    }

    .switch-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 0.92rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .switch-btn:hover {
      color: #fff;
    }

    .switch-btn.active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2) 0%, rgba(59, 130, 246, 0.2) 100%);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      box-shadow: 0 2px 10px rgba(56, 189, 248, 0.2);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-arrow-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-arrow-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    /* Contenedor con scroll del contenido */
    .content-scroll-container {
      flex: 1;
      overflow-y: auto;
      padding: 2.2rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* Animación de entrada de contenidos */
    .fade-enter {
      animation: fadeUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ==========================================================================
       TARJETAS GLASSMORPHISM & PRESENTACIÓN DE TEORÍA (ZOOM OPTIMIZED)
       ========================================================================== */
    .glass-panel {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .glass-panel:hover {
      border-color: var(--border-medium);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
    }

    .panel-header {
      padding: 1.25rem 1.6rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0) 100%);
    }

    .panel-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .panel-icon-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--neon-cyan);
      font-size: 0.95rem;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    .panel-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
    }

    .panel-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .panel-body {
      padding: 1.6rem;
    }

    /* Rejilla de diapositivas de teoría */
    .theory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 1.4rem;
    }

    .slide-card {
      background: rgba(13, 20, 36, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1.8rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .slide-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(180deg, var(--neon-cyan) 0%, var(--neon-blue) 100%);
      opacity: 0.8;
    }

    .slide-card:hover {
      transform: translateY(-4px);
      border-color: rgba(56, 189, 248, 0.35);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(56, 189, 248, 0.12);
    }

    .slide-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .slide-tag {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--neon-cyan);
      letter-spacing: 0.05em;
    }

    .slide-num {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.2);
    }

    .slide-heading {
      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
    }

    .slide-text {
      font-size: 1.15rem; /* Letra grande y legible en Zoom */
      color: var(--text-secondary);
      line-height: 1.7;
    }

    .slide-text strong {
      color: #fff;
      font-weight: 600;
    }

    .slide-text code {
      font-family: var(--font-mono);
      background: var(--bg-code);
      color: #7dd3fc;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.95em;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    /* ==========================================================================
       MODO LABORATORIO: SIMULADORES Y PANELES INTERACTIVOS
       ========================================================================== */
    .lab-hero-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1.2rem;
      padding: 1.4rem 1.8rem;
      background: rgba(13, 20, 36, 0.85);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-md);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .demo-buttons-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0.65rem 1.25rem;
      font-family: var(--font-sans);
      font-size: 0.92rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
      user-select: none;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #38bdf8 0%, #3b82f6 100%);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.45);
      color: #040810;
    }

    .btn-demo-highlight {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.25) 0%, rgba(217, 70, 239, 0.2) 100%);
      color: #f5d0fe;
      border: 1px solid rgba(217, 70, 239, 0.4);
      box-shadow: 0 4px 15px rgba(217, 70, 239, 0.2);
    }

    .btn-demo-highlight:hover {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.4) 0%, rgba(217, 70, 239, 0.35) 100%);
      border-color: rgba(217, 70, 239, 0.7);
      color: #fff;
      box-shadow: 0 6px 22px rgba(217, 70, 239, 0.4);
    }

    .btn-demo-cyan {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.25) 0%, rgba(56, 189, 248, 0.2) 100%);
      color: #a5f3fc;
      border: 1px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2);
    }

    .btn-demo-cyan:hover {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.4) 0%, rgba(56, 189, 248, 0.35) 100%);
      border-color: rgba(56, 189, 248, 0.7);
      color: #fff;
      box-shadow: 0 6px 22px rgba(56, 189, 248, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      border-color: var(--border-medium);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.3);
    }

    .btn-emerald {
      background: rgba(16, 185, 129, 0.2);
      color: #a7f3d0;
      border-color: rgba(16, 185, 129, 0.4);
    }

    .btn-emerald:hover {
      background: rgba(16, 185, 129, 0.35);
      border-color: rgba(16, 185, 129, 0.7);
      color: #fff;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.2);
      color: #fecaca;
      border-color: rgba(239, 68, 68, 0.4);
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.35);
      border-color: rgba(239, 68, 68, 0.7);
      color: #fff;
    }

    /* Formularios e inputs flexibles */
    .controls-grid {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      padding: 1.2rem 1.6rem;
      background: rgba(8, 14, 26, 0.7);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      margin-top: 1rem;
    }

    .input-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-item label {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-field, .select-field {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border-medium);
      color: #fff;
      padding: 0.55rem 0.9rem;
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 0.92rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-field:focus, .select-field:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
    }

    /* KPIs numéricos para Zoom */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.2rem;
      margin-top: 1.4rem;
    }

    .kpi-card {
      background: rgba(13, 20, 36, 0.7);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .kpi-title {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.4rem;
    }

    .kpi-number {
      font-family: var(--font-mono);
      font-size: 2.2rem;
      font-weight: 800;
      color: #fff;
      line-height: 1.2;
    }

    .kpi-subtext {
      font-size: 0.82rem;
      color: var(--text-dim);
      margin-top: 0.35rem;
    }

    /* Auditoría matemática y técnica */
    .audit-terminal {
      background: var(--bg-code);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: var(--radius-sm);
      padding: 1.4rem;
      font-family: var(--font-mono);
      font-size: 0.95rem;
      color: #e2e8f0;
      margin-top: 1.4rem;
      line-height: 1.7;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.6);
    }

    .audit-header-tag {
      font-size: 0.75rem;
      color: var(--neon-cyan);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .audit-header-tag::before {
      content: '>';
      font-weight: 800;
      color: var(--neon-emerald);
    }

    .audit-alert-box {

  <script>
    // --------------------------------------------------------------------------
    // 1. FONDO INTERACTIVO 4K CON CANVAS
    // --------------------------------------------------------------------------
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    const PARTICLE_COUNT = 55;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.45;
        this.vy = (Math.random() - 0.5) * 0.45;
        this.radius = Math.random() * 2 + 1;
        this.alpha = Math.random() * 0.5 + 0.2;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(56, 189, 248, ${this.alpha})`;
        ctx.fill();
      }
    }

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push(new Particle());
    }

    function animateBg() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Dibujar líneas conectivas
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 140) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = `rgba(56, 189, 248, ${0.15 * (1 - dist / 140)})`;
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
      }

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      requestAnimationFrame(animateBg);
    }
    animateBg();

            body: "Flujo de control secuencial dentro de un proceso. <strong>Recursos compartidos:</strong> Segmento de código (.text), variables globales (.data), memoria dinámica (Heap) y archivos abiertos. <strong>Recursos privados por hilo:</strong> Identificador TID, Contador de Programa (PC), banco de registros y Pila propia (Stack)."
          },

            num: "02",
            title: "Ley de Amdahl y Speedup",
            body: "Calcula la aceleración teórica al usar <code>N</code> núcleos sobre una aplicación con fracción paralelizable <code>P</code> (y fracción serie <code>1 - P</code>):<br><code>S(N) = 1 / ((1 - P) + (P / N))</code>.<br>Límite teórico cuando <code>N &rarr; &infin;</code>: <code>S_max = 1 / (1 - P)</code>."
          },

            num: "03",
            title: "Economía de Recursos vs Procesos",
            body: "Crear un hilo consume órdenes de magnitud menos memoria que un proceso completo (un hilo requiere solo su stack ~64 KB - 1 MB frente a ~4 MB de tablas de página y PCB por proceso independiente). El cambio de contexto entre hilos del mismo proceso no invalida la caché TLB."
          }
        ]

        title: "Sincronización",
        cards: [

            num: "01",
            title: "Condición de Carrera (Race Condition)",
            body: "Ocurre cuando varios hilos leen y escriben datos compartidos concurrentemente y el resultado final depende del orden de intercalación de instrucciones. La instrucción <code>count++</code> se descompone en 3 microinstrucciones de máquina: <code>R1 = count</code>, <code>R1 = R1 + 1</code>, <code>count = R1</code>."
          },

            num: "02",
            title: "Problema de la Sección Crítica",
            body: "Fragmento de código que manipula datos compartidos. Debe garantizar 3 requisitos formales: <strong>1. Exclusión Mutua</strong> (un solo hilo dentro a la vez), <strong>2. Progreso</strong> (la selección no se pospone indefinidamente), <strong>3. Espera Acotada</strong> (límite de entradas de otros hilos antes de concederla)."
          },

            num: "03",

        { pid: 101, state: "Ejecutando", pc: "0x00401A20", cpuTime: 4, priority: 2 },
        { pid: 102, state: "Esperando", pc: "0x00402F00", cpuTime: 8, priority: 1 },
        { pid: 103, state: "Esperando", pc: "0x00400810", cpuTime: 2, priority: 3 }
      ];
      stateT9.lastAction = "Demo Cargada: Procesos suspendidos esperando periféricos";
      stateT9.auditMsg = "Dos procesos en estado Esperando aguardando interrupciones de periféricos de E/S.";
      stateT9.auditAlert = "REGLA FORMAL: Al recibir señal de fin de E/S, el proceso no puede volver directamente a la CPU; debe reingresar a Preparado.";
      renderView();
    }

    function actionT9_Admitir() {
      const pid = stateT9.nextPid++;
      stateT9.processes.push({ pid, state: "Preparado", pc: "0x00400000", cpuTime: 0, priority: 2 });
      stateT9.lastAction = `Admitir: Creado PID_${pid} en estado Preparado (Nuevo -> Preparado)`;
      stateT9.auditMsg = "Transición LEGAL. Proceso cargado en memoria principal y encolado en cola de listos.";
      stateT9.auditAlert = null;
      renderView();
    }

    function actionT9_Despachar() {
      const running = stateT9.processes.find(p => p.state === "Ejecutando");
      const ready = stateT9.processes.find(p => p.state === "Preparado");
      if (!ready) {
        stateT9.lastAction = "Despachar rechazado: Cola de preparados vacía.";
        stateT9.auditAlert = "ERROR DE TRANSICIÓN: No hay procesos en cola de preparados. La CPU pasa a IDLE.";
        renderView();
        return;
      }
      if (running) running.state = "Preparado";
      ready.state = "Ejecutando";
      stateT9.contextSwitches++;
      stateT9.lastAction = `Despacho: PID_${ready.pid} pasa a Ejecutando (Preparado -> Ejecutando)`;
      stateT9.auditMsg = "Transición LEGAL. Salva registros salientes y carga el PCB de PID_" + ready.pid;
      stateT9.auditAlert = null;
      renderView();
    }

    function actionT9_Quantum() {
      const running = stateT9.processes.find(p => p.state === "Ejecutando");
      if (!running) {
        stateT9.auditAlert = "ERROR: No hay ningún proceso en la CPU para desalojar.";
        renderView();
        return;
      }
      running.state = "Preparado";
      running.cpuTime += 2;
      stateT9.contextSwitches++;
      const next = stateT9.processes.find(p => p.state === "Preparado" && p.pid !== running.pid);
      if (next) {
        next.state = "Ejecutando";
        stateT9.lastAction = `Fin Quantum: PID_${running.pid} desalojado. PID_${next.pid} despachado.`;
      } else {
        running.state = "Ejecutando";
        stateT9.lastAction = `Fin Quantum: PID_${running.pid} reanuda (es el único preparado).`;
      }
      stateT9.auditMsg = "Transición LEGAL: Desalojo apropiativo por temporizador de reloj.";
      stateT9.auditAlert = null;
      renderView();
    }

    function actionT9_PedirIO() {
      const running = stateT9.processes.find(p => p.state === "Ejecutando");
      if (!running) {
        stateT9.auditAlert = "ERROR: Solo el proceso en ejecución puede invocar una llamada al sistema bloqueante de E/S.";
        renderView();
        return;
      }
      running.state = "Esperando";
      stateT9.contextSwitches++;
      const next = stateT9.processes.find(p => p.state === "Preparado");
      if (next) next.state = "Ejecutando";
      stateT9.lastAction = `Petición E/S: PID_${running.pid} bloqueado (Ejecutando -> Esperando)`;
      stateT9.auditMsg = "Transición LEGAL: Proceso extraído de la CPU a la cola del dispositivo.";
      stateT9.auditAlert = null;
      renderView();
    }

    function actionT9_FinIO() {
      const waiting = stateT9.processes.find(p => p.state === "Esperando");
      if (!waiting) {
        stateT9.auditAlert = "ERROR: No hay procesos en cola de Esperando.";
        renderView();
        return;
      }
      waiting.state = "Preparado";
      stateT9.lastAction = `Fin E/S: PID_${waiting.pid} pasa a Preparado (Esperando -> Preparado)`;
      stateT9.auditMsg = "Transición LEGAL: Interrupción de E/S completa. El proceso compite nuevamente en la cola de preparados.";
      stateT9.auditAlert = null;
      renderView();
    }

    function actionT9_Terminar() {
      const running = stateT9.processes.find(p => p.state === "Ejecutando");
      if (!running) {
        stateT9.auditAlert = "ERROR: Solo el proceso en ejecución puede invocar exit().";
        renderView();
        return;
      }
      running.state = "Terminado";
      const next = stateT9.processes.find(p => p.state === "Preparado");
      if (next) next.state = "Ejecutando";
      stateT9.lastAction = `Terminación: PID_${running.pid} finaliza (Ejecutando -> Terminado)`;
      stateT9.auditMsg = "Transición LEGAL: Recursos y memoria liberados por el kernel.";
      stateT9.auditAlert = null;
      renderView();
    }

    function dispatchSpecificPid(pid) {
      const target = stateT9.processes.find(p => p.pid === pid);
      if (!target || target.state !== "Preparado") return;
      const running = stateT9.processes.find(p => p.state === "Ejecutando");
      if (running) running.state = "Preparado";
      target.state = "Ejecutando";
      stateT9.contextSwitches++;
      stateT9.lastAction = `Despacho selectivo: PID_${pid} toma la CPU.`;
      stateT9.auditAlert = null;
      renderView();
    }

    function unblockSpecificPid(pid) {
      const target = stateT9.processes.find(p => p.pid === pid);
      if (target && target.state === "Esperando") {
        target.state = "Preparado";
        stateT9.lastAction = `Interrupción: PID_${pid} desbloqueado a Preparado.`;
        stateT9.auditAlert = null;
        renderView();
      }
    }

    // ==========================================================================
    // SIMULADOR TEMA 10: PLANIFICACIÓN CPU (GANTT DINÁMICO + CONVOY + DEMOS)
    // ==========================================================================
    function calculateScheduleT10() {
      const procs = stateT10.processes.map(p => ({
        pid: p.pid,
        arrival: parseInt(p.arrival, 10),
        burst: parseInt(p.burst, 10),
        remaining: parseInt(p.burst, 10),
        start: -1,
        finish: 0,
        turnaround: 0,
        waiting: 0
      }));

      const alg = stateT10.algorithm;
      const q = parseInt(stateT10.quantum, 10) || 2;
      const gantt = [];
      let time = 0;
      let completed = 0;
      const n = procs.length;

      if (n === 0) {
        stateT10.evaluated = [];
        stateT10.gantt = [];
        return;
      }

      if (alg === "FCFS") {
        const sorted = [...procs].sort((a, b) => a.arrival - b.arrival);
        sorted.forEach(p => {
          if (time < p.arrival) {
            gantt.push({ pid: "IDLE", start: time, end: p.arrival, duration: p.arrival - time });
            time = p.arrival;
          }
          p.start = time;
          gantt.push({ pid: p.pid, start: time, end: time + p.burst, duration: p.burst });
          time += p.burst;
          p.finish = time;
          p.turnaround = p.finish - p.arrival;
          p.waiting = p.turnaround - p.burst;
        });
        stateT10.evaluated = sorted;
      } else if (alg === "SJF") {
        const finishedSet = new Set();
        while (completed < n) {
          const ready = procs.filter(p => p.arrival <= time && !finishedSet.has(p.pid));
          if (ready.length === 0) {
            gantt.push({ pid: "IDLE", start: time, end: time + 1, duration: 1 });
            time++;
            continue;
          }
          ready.sort((a, b) => a.burst - b.burst || a.arrival - b.arrival);
          const curr = ready[0];
          curr.start = time;
          gantt.push({ pid: curr.pid, start: time, end: time + curr.burst, duration: curr.burst });
          time += curr.burst;
          curr.finish = time;
          curr.turnaround = curr.finish - curr.arrival;
          curr.waiting = curr.turnaround - curr.burst;
          finishedSet.add(curr.pid);
          completed++;
        }
        stateT10.evaluated = procs;
      } else if (alg === "SRTF") {
        while (completed < n) {
          const ready = procs.filter(p => p.arrival <= time && p.remaining > 0);
          if (ready.length === 0) {
            if (gantt.length > 0 && gantt[gantt.length - 1].pid === "IDLE") {
              gantt[gantt.length - 1].end++;
              gantt[gantt.length - 1].duration++;
            } else {
              gantt.push({ pid: "IDLE", start: time, end: time + 1, duration: 1 });
            }
            time++;
            continue;
          }
          ready.sort((a, b) => a.remaining - b.remaining || a.arrival - b.arrival);
          const curr = ready[0];
          if (curr.start === -1) curr.start = time;

          if (gantt.length > 0 && gantt[gantt.length - 1].pid === curr.pid) {
            gantt[gantt.length - 1].end++;
            gantt[gantt.length - 1].duration++;
          } else {
            gantt.push({ pid: curr.pid, start: time, end: time + 1, duration: 1 });
          }

          curr.remaining--;
          time++;
          if (curr.remaining === 0) {
            curr.finish = time;
            curr.turnaround = curr.finish - curr.arrival;
            curr.waiting = curr.turnaround - curr.burst;
            completed++;
          }
        }
        stateT10.evaluated = procs;
      } else if (alg === "RR") {
        const queue = [];
        let pIndex = 0;
        const sortedArrival = [...procs].sort((a, b) => a.arrival - b.arrival);

        while (completed < n) {
          while (pIndex < n && sortedArrival[pIndex].arrival <= time) {
            queue.push(sortedArrival[pIndex]);
            pIndex++;
          }
          if (queue.length === 0) {
            gantt.push({ pid: "IDLE", start: time, end: time + 1, duration: 1 });
            time++;
            continue;
          }
          const curr = queue.shift();
          if (curr.start === -1) curr.start = time;
          const slice = Math.min(curr.remaining, q);
          gantt.push({ pid: curr.pid, start: time, end: time + slice, duration: slice });
          curr.remaining -= slice;
          time += slice;

          while (pIndex < n && sortedArrival[pIndex].arrival <= time) {
            queue.push(sortedArrival[pIndex]);
            pIndex++;
          }

          if (curr.remaining > 0) {
            queue.push(curr);
          } else {
            curr.finish = time;
            curr.turnaround = curr.finish - curr.arrival;
            curr.waiting = curr.turnaround - curr.burst;
            completed++;
          }
        }
        stateT10.evaluated = procs;
      }

      stateT10.gantt = gantt;
      const totalTurnaround = stateT10.evaluated.reduce((a, b) => a + b.turnaround, 0);
      const totalWaiting = stateT10.evaluated.reduce((a, b) => a + b.waiting, 0);
      const totalBurst = stateT10.processes.reduce((a, b) => a + parseInt(b.burst, 10), 0);

      stateT10.tmr = (totalTurnaround / n).toFixed(2);
      stateT10.tme = (totalWaiting / n).toFixed(2);
      stateT10.cpuUtil = time > 0 ? ((totalBurst / time) * 100).toFixed(1) + "%" : "100%";

      // Comprobar Efecto Convoy
      stateT10.hasConvoy = false;
      if (alg === "FCFS" && stateT10.evaluated.length >= 2) {
        const first = stateT10.evaluated[0];
        const othersAvgBurst = stateT10.evaluated.slice(1).reduce((a, b) => a + b.burst, 0) / (stateT10.evaluated.length - 1);
        if (first.burst >= 2 * othersAvgBurst && first.burst >= 6) {
          stateT10.hasConvoy = true;
        }
      }
    }

    function demoT11_BloqueoLleno() {
      stateT11.mode = "blocking";
      stateT11.capacity = 2;
      stateT11.mailbox = [
        { id: "M1", sender: "P1", text: "FRAME_0", size: 256 },
        { id: "M2", sender: "P2", text: "FRAME_1", size: 256 }
      ];
      stateT11.p1State = "Activo";
      stateT11.p3State = "Activo";
      stateT11.auditMsg = "Buzón al 100% de capacidad. El próximo send() suspenderá al emisor.";
      stateT11.auditAlert = "CONDICIÓN DE LLENO: Al intentar enviar otro mensaje, P1 quedará bloqueado de inmediato.";
      renderView();
    }

    function demoT11_BloqueoVacio() {
      stateT11.mode = "blocking";
      stateT11.capacity = 3;
      stateT11.mailbox = [];
      stateT11.p1State = "Activo";
      stateT11.p3State = "Activo";
      stateT11.auditMsg = "Buzón totalmente vacío (0 slots). El próximo receive() suspenderá al receptor.";
      stateT11.auditAlert = "CONDICIÓN DE VACÍO: Al intentar extraer un mensaje, P3 quedará bloqueado esperando datos.";
      renderView();
    }

    function changeT11Mode(val) {
      stateT11.mode = val;
      stateT11.p1State = "Activo";
      stateT11.p3State = "Activo";
      stateT11.auditAlert = null;
      renderView();
    }

    function changeT11Cap(val) {
      stateT11.capacity = parseInt(val, 10);
      if (stateT11.mailbox.length > stateT11.capacity) {
        stateT11.mailbox = stateT11.mailbox.slice(0, stateT11.capacity);
      }
      renderView();
    }

    function sendT11(sender) {
      if (stateT11.mailbox.length >= stateT11.capacity) {
        if (stateT11.mode === "blocking") {
          stateT11.p1State = "Bloqueado";
          stateT11.auditMsg = `Buzón LLENO (${stateT11.capacity}/${stateT11.capacity}). ${sender} queda suspendido en la cola de espera del buzón.`;
          stateT11.auditAlert = `BLOQUEO SÍNCRONO: Emisor ${sender} suspendido hasta que P3 extraiga un mensaje.`;
        } else {
          stateT11.auditMsg = `Buzón LLENO. En modo Asíncrono, ${sender} recibe error EAGAIN sin suspenderse.`;
          stateT11.auditAlert = "RECHAZO ASÍNCRONO: Mensaje descartado por falta de espacio.";
        }
        renderView();
        return;
      }
      const id = "M" + (stateT11.mailbox.length + 1);
      stateT11.mailbox.push({ id, sender, text: `PAYLOAD_${Date.now()%1000}`, size: 256 });
      stateT11.totalCopies++;
      stateT11.p3State = "Activo";
      stateT11.auditMsg = `${sender} ejecutó send(). Mensaje ${id} copiado al espacio kernel (Copia 1: Usuario -> Kernel).`;
      stateT11.auditAlert = null;
      renderView();
    }

    function receiveT11() {
      if (stateT11.mailbox.length === 0) {
        if (stateT11.mode === "blocking") {
          stateT11.p3State = "Bloqueado";
          stateT11.auditMsg = "Buzón VACÍO. P3 queda suspendido hasta la llegada de un nuevo mensaje.";
          stateT11.auditAlert = "BLOQUEO SÍNCRONO: Receptor P3 suspendido esperando datos.";
        } else {
          stateT11.auditMsg = "Buzón VACÍO. En modo Asíncrono, P3 recibe NULL y continúa.";
          stateT11.auditAlert = null;
        }
        renderView();
        return;
      }
      const delivered = stateT11.mailbox.shift();
      stateT11.totalCopies++;
      stateT11.p1State = "Activo";
      stateT11.p3State = "Activo";
      stateT11.auditMsg = `P3 extrajo el mensaje ${delivered.id} en orden FIFO (Copia 2: Kernel -> Usuario).`;
      stateT11.auditAlert = null;
      renderView();
    }

    // ==========================================================================
    // SIMULADOR TEMA 12: MEMORIA COMPARTIDA (ANILLO BUFFER CIRCULAR in / out)
    // ==========================================================================
    function renderLabT12(container) {
      const count = stateT12.buffer.filter(x => x !== null).length;
      const isEmpty = stateT12.inPtr === stateT12.outPtr;
      const isFull = (stateT12.inPtr + 1) % stateT12.size === stateT12.outPtr;
      const nextIn = (stateT12.inPtr + 1) % stateT12.size;

      const panel = document.createElement('div');
      panel.className = 'glass-panel';
      panel.innerHTML = `
        <div class="panel-header">
          <div class="panel-header-left">
            <div class="panel-icon-pill">12</div>
            <div>
              <h3 class="panel-title">Laboratorio: Memoria Compartida (Búfer Circular)</h3>
              <p class="panel-subtitle">Verificación de condiciones de vacío (in == out) y lleno ((in + 1) % N == out)</p>
            </div>
          </div>
          <div class="demo-buttons-group">
            <button class="btn btn-demo-highlight" onclick="demoT12_Llenar()">Demo 1: Llenar Búfer al Borde</button>

        </div>

        <div class="panel-body">
          <!-- Barra de Acciones del Productor / Consumidor -->
          <div class="lab-hero-bar">
            <div style="font-size:0.95rem; font-weight:600; color:#fff;">Operaciones de Memoria Directa (Sin Kernel):</div>
            <div class="demo-buttons-group">
              <button class="btn btn-primary" onclick="produceT12()">+ Producir Elemento (in++)</button>
              <button class="btn btn-emerald" onclick="consumeT12()">- Consumir Elemento (out++)</button>
              <button class="btn btn-secondary" onclick="clearT12()">Resetear Búfer</button>
            </div>
          </div>

          <!-- REPRESENTACIÓN RADIAL / CIRCULAR EN SVG -->
          <div class="ring-buffer-container">
            <svg viewBox="0 0 460 460" style="width:360px; height:360px;">
              <!-- Círculo Guía -->
              <circle cx="230" cy="230" r="140" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" stroke-dasharray="6,6" />

              <!-- Centro del Anillo -->
              <circle cx="230" cy="230" r="60" fill="rgba(15,23,42,0.9)" stroke="rgba(56,189,248,0.3)" stroke-width="2" />
              <text x="230" y="225" fill="#fff" font-size="14" font-weight="700" text-anchor="middle" font-family="var(--font-sans)">BÚFER SHM</text>
              <text x="230" y="245" fill="var(--neon-cyan)" font-size="12" font-family="var(--font-mono)" text-anchor="middle">N = ${stateT12.size}</text>

              <!-- Celdas del Búfer Circular en arco -->
              ${[...Array(stateT12.size)].map((_, i) => {
                const angle = (i * (360 / stateT12.size) - 90) * (Math.PI / 180);
                const cx = 230 + 140 * Math.cos(angle);
                const cy = 230 + 140 * Math.sin(angle);
                const val = stateT12.buffer[i];
                const isIn = stateT12.inPtr === i;
                const isOut = stateT12.outPtr === i;

                let strokeColor = "rgba(255,255,255,0.2)";
                let fillColor = "rgba(13,20,36,0.9)";
                if (val !== null) {
                  strokeColor = "#38bdf8";
                  fillColor = "rgba(56,189,248,0.25)";
                }

                return `
                  <!-- Celda -->
                  <circle cx="${cx}" cy="${cy}" r="28" fill="${fillColor}" stroke="${strokeColor}" stroke-width="2.5" />
                  <text x="${cx}" y="${cy - 2}" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" font-family="var(--font-mono)">
                    #${i}
                  </text>
                  <text x="${cx}" y="${cy + 13}" fill="${val ? '#7dd3fc' : '#64748b'}" font-size="9" text-anchor="middle" font-family="var(--font-mono)">
                    ${val ? val : 'NULL'}
                  </text>

                  <!-- Puntero in (Productor) -->
                  ${isIn ? `
                    <circle cx="${cx}" cy="${cy}" r="34" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />
                    <text x="${cx}" y="${cy - 38}" fill="#38bdf8" font-size="12" font-weight="800" text-anchor="middle" font-family="var(--font-mono)">in &darr;</text>
                  ` : ''}

                  <!-- Puntero out (Consumidor) -->
                  ${isOut ? `
                    <text x="${cx}" y="${cy + 46}" fill="#10b981" font-size="12" font-weight="800" text-anchor="middle" font-family="var(--font-mono)">&uarr; out</text>
                  ` : ''}
                `;
              }).join('')}
            </svg>
          </div>

          <!-- KPIs -->
          <div class="kpi-row">
            <div class="kpi-card">
              <span class="kpi-title">Elementos en Búfer</span>
              <span class="kpi-number">${count} / ${stateT12.size - 1}</span>
              <span class="kpi-subtext">Capacidad máxima útil es N - 1</span>
            </div>
            <div class="kpi-card">
              <span class="kpi-title">Puntero in (Productor)</span>
              <span class="kpi-number" style="color:var(--neon-cyan);">#${stateT12.inPtr}</span>

            <div class="kpi-card">
              <span class="kpi-title">Puntero out (Consumidor)</span>
              <span class="kpi-number" style="color:var(--neon-emerald);">#${stateT12.outPtr}</span>

          </div>

          <div class="audit-terminal">
            <div class="audit-header-tag">Comprobación Matemática ULL ESIT</div>
            <div><strong>Comprobación de Vacío:</strong> (in == out) &rArr; (${stateT12.inPtr} == ${stateT12.outPtr}) = <strong style="color:${isEmpty ? 'var(--neon-rose)' : 'var(--neon-emerald)'};">${isEmpty ? 'VERDADERO (Búfer Vacío)' : 'FALSO'}</strong></div>
            <div><strong>Comprobación de Lleno:</strong> ((in + 1) % N == out) &rArr; ((${stateT12.inPtr} + 1) % ${stateT12.size} == ${stateT12.outPtr}) &rArr; (${nextIn} == ${stateT12.outPtr}) = <strong style="color:${isFull ? 'var(--neon-rose)' : 'var(--neon-emerald)'};">${isFull ? 'VERDADERO (Búfer Lleno)' : 'FALSO'}</strong></div>
            <div style="margin-top:0.4rem; color:var(--text-muted);">
              <strong>Regla Académica:</strong> Se reservan N = ${stateT12.size} celdas, pero se limitan a N - 1 = ${stateT12.size - 1} elementos para que la condición de lleno no se solape aritméticamente con la de vacío.
            </div>
            ${stateT12.auditAlert ? `<div class="audit-alert-box">${stateT12.auditAlert}</div>` : ''}
          </div>
        </div>
      `;
      container.appendChild(panel);
    }

    function demoT12_Llenar() {
      stateT12.size = 8;
      stateT12.inPtr = 7;
      stateT12.outPtr = 0;
      stateT12.buffer = ["A", "B", "C", "D", "E", "F", "G", null];
      stateT12.auditMsg = "Búfer cargado con 7 elementos (N=8). Próximo intento de inserción activará lleno.";
      stateT12.auditAlert = "CONDICIÓN DE LLENO ACTIVADA: ((7 + 1) % 8 == 0). El productor debe esperar.";
      renderView();
    }

    function demoT12_Vaciar() {
      stateT12.inPtr = 0;
      stateT12.outPtr = 0;
      stateT12.buffer = Array(stateT12.size).fill(null);
      stateT12.auditMsg = "Búfer vaciado por completo (in == out == 0).";
      stateT12.auditAlert = "CONDICIÓN DE VACÍO ACTIVADA: (in == out). El consumidor debe esperar.";
      renderView();
    }

    function produceT12() {
      const isFull = (stateT12.inPtr + 1) % stateT12.size === stateT12.outPtr;
      if (isFull) {
        stateT12.auditAlert = `RECHAZADO: Búfer LLENO. ((in + 1) % ${stateT12.size} == out). El productor no puede sobreescribir datos.`;
        renderView();
        return;
      }
      stateT12.buffer[stateT12.inPtr] = `ITEM_${stateT12.inPtr}`;
      stateT12.inPtr = (stateT12.inPtr + 1) % stateT12.size;
      stateT12.auditAlert = null;
      renderView();
    }

    function consumeT12() {
      const isEmpty = stateT12.inPtr === stateT12.outPtr;
      if (isEmpty) {
        stateT12.auditAlert = "RECHAZADO: Búfer VACÍO. (in == out). No hay elementos para consumir.";
        renderView();
        return;
      }
      stateT12.buffer[stateT12.outPtr] = null;
      stateT12.outPtr = (stateT12.outPtr + 1) % stateT12.size;
      stateT12.auditAlert = null;
      renderView();
    }

    function clearT12() {
      stateT12.inPtr = 0;
      stateT12.outPtr = 0;
      stateT12.buffer = Array(stateT12.size).fill(null);
      stateT12.auditAlert = null;
      renderView();
    }

                <div style="display:flex; justify-content:space-between; font-size:0.75rem; font-family:var(--font-mono); color:var(--text-dim); margin-top:4px;">
                  <span>0x</span>
                  <span>${S}x alcanzado</span>
                  <span>Límite ${Smax}x</span>
                </div>
              </div>
            </div>
          </div>

          <!-- KPIs -->
          <div class="kpi-row">
            <div class="kpi-card">
              <span class="kpi-title">Speedup S(N)</span>
              <span class="kpi-number" style="color:var(--neon-emerald);">${S}x</span>
              <span class="kpi-subtext">Aceleración sobre 1 núcleo</span>
            </div>
            <div class="kpi-card">
              <span class="kpi-title">Eficiencia Paralela</span>
              <span class="kpi-number" style="color:var(--neon-cyan);">${efficiency}%</span>
              <span class="kpi-subtext">Fórmula: (S / N) &times; 100</span>
            </div>
            <div class="kpi-card">
              <span class="kpi-title">Ahorro de Memoria RAM</span>
              <span class="kpi-number" style="color:var(--neon-purple); font-size:1.8rem;">~90%</span>
              <span class="kpi-subtext">Respecto a N procesos completos</span>
            </div>
          </div>

          <!-- Auditoría -->
          <div class="audit-terminal">
            <div class="audit-header-tag">Fórmula Formal de Amdahl (ULL ESIT)</div>
            <div><code>S(N) = 1 / ((1 - P) + (P / N))</code> &rArr; <code>1 / (${(1 - P).toFixed(2)} + (${P} / ${N})) = ${S}x</code>.</div>
            <div><strong>Conclusión de Rendimiento:</strong> Aunque añadas infinitos procesadores, la aceleración jamás superará <strong style="color:var(--neon-purple);">${Smax}x</strong> debido a que el ${((1 - P) * 100).toFixed(0)}% del código es estrictamente secuencial.</div>
          </div>
        </div>
      `;
      container.appendChild(panel);
    }

    function demoT13_AltaParalelizacion() {
      stateT13.fractionP = 0.95;
      stateT13.threadsN = 16;
      renderView();
    }

    function demoT13_CuelloBotella() {
      stateT13.fractionP = 0.50;
      stateT13.threadsN = 16;
      renderView();
    }

    function changeT13P(val) {
      stateT13.fractionP = parseFloat(val);
      renderView();
    }

    function changeT13N(val) {
      stateT13.threadsN = parseInt(val, 10);
      renderView();
    }

    // ==========================================================================
    // SIMULADOR TEMA 14: SINCRONIZACIÓN (RACE CONDITIONS VS MUTEX)
    // ==========================================================================
    function renderLabT14(container) {
      const steps = stateT14.useMutex ? microstepsWithMutex : microstepsWithoutMutex;
      const current = steps[Math.max(0, stateT14.stepIndex - 1)] || { count: 5, r1: 0, r2: 0 };
      const isCorrupt = !stateT14.useMutex && stateT14.stepIndex === 6;

      const panel = document.createElement('div');
      panel.className = 'glass-panel';
      panel.innerHTML = `
        <div class="panel-header">
          <div class="panel-header-left">
            <div class="panel-icon-pill">14</div>
            <div>
              <h3 class="panel-title">Laboratorio: Sincronización, Condición de Carrera y Cerrojo Mutex</h3>
              <p class="panel-subtitle">Descomposición de count++ y count-- en microinstrucciones de ensamblador</p>
            </div>
          </div>
          <div class="demo-buttons-group">
            <button class="btn btn-demo-highlight" onclick="demoT14_SinMutex()">Demo 1: Ejecutar SIN Mutex (Carrera)</button>
            <button class="btn btn-emerald" onclick="demoT14_ConMutex()">Demo 2: Ejecutar CON Mutex (Protegido)</button>
          </div>
        </div>

        <div class="panel-body">
          <!-- Controles de Paso a Paso -->
          <div class="lab-hero-bar">
            <div style="display:flex; align-items:center; gap:12px;">
              <span class="mutex-lock-badge ${stateT14.useMutex ? 'mutex-locked' : 'mutex-unlocked'}">
                ${stateT14.useMutex ? 'MUTEX ACTIVADO' : 'MUTEX DESACTIVADO'}
              </span>
              <span style="font-size:0.88rem; color:var(--text-muted);">Paso actual: ${stateT14.stepIndex} / 6</span>
            </div>
            <div class="demo-buttons-group">
              <button class="btn btn-primary" onclick="stepT14()">Paso a Paso &rarr;</button>
              <button class="btn btn-secondary" onclick="runAllT14()">Ejecutar Todo</button>
              <button class="btn btn-secondary" onclick="resetT14()">Reiniciar</button>
            </div>
          </div>

          <!-- CÓDIGO DIVIDIDO A DOS COLUMNAS (HILO A vs HILO B) -->
          <div class="sync-split-code-view">
            <!-- Hilo 1: Incrementador count++ -->
            <div class="thread-code-card" style="border-color:${current.thread === 1 ? 'var(--neon-cyan)' : 'var(--border-subtle)'};">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.8rem;">
                <span style="font-family:var(--font-mono); font-size:0.85rem; font-weight:700; color:var(--neon-cyan);">HILO 1 (count++)</span>
                <span class="badge badge-ready">Registro R1 = ${stateT14.r1}</span>
              </div>
              <div class="pcb-code-block">
<span style="color:#94a3b8;">// C++: count++</span>
${stateT14.useMutex ? '<span style="color:#86efac;">pthread_mutex_lock(&m);</span>\n' : ''}R1 = count;       <span style="color:#64748b;">// Carga en CPU</span>
R1 = R1 + 1;     <span style="color:#64748b;">// Incrementa</span>
count = R1;       <span style="color:#64748b;">// Escribe en RAM</span>
${stateT14.useMutex ? '<span style="color:#86efac;">pthread_mutex_unlock(&m);</span>' : ''}
              </div>
            </div>

            <!-- Hilo 2: Decrementador count-- -->
            <div class="thread-code-card" style="border-color:${current.thread === 2 ? 'var(--neon-rose)' : 'var(--border-subtle)'};">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.8rem;">
                <span style="font-family:var(--font-mono); font-size:0.85rem; font-weight:700; color:var(--neon-rose);">HILO 2 (count--)</span>
                <span class="badge badge-error">Registro R2 = ${stateT14.r2}</span>
              </div>
              <div class="pcb-code-block">
<span style="color:#94a3b8;">// C++: count--</span>
${stateT14.useMutex ? '<span style="color:#86efac;">pthread_mutex_lock(&m);</span>\n' : ''}R2 = count;       <span style="color:#64748b;">// Carga en CPU</span>
R2 = R2 - 1;     <span style="color:#64748b;">// Decrementa</span>
count = R2;       <span style="color:#64748b;">// Escribe en RAM</span>
${stateT14.useMutex ? '<span style="color:#86efac;">pthread_mutex_unlock(&m);</span>' : ''}
              </div>
            </div>
          </div>

          <!-- KPIs -->
          <div class="kpi-row">
            <div class="kpi-card">
              <span class="kpi-title">Valor en RAM de count</span>
              <span class="kpi-number" style="color:${isCorrupt ? 'var(--neon-red)' : 'var(--neon-emerald)'};">
                ${current.count}
              </span>
              <span class="kpi-subtext">${isCorrupt ? '¡CORRUPCIÓN DE MEMORIA!' : 'Valor teórico esperado: 5'}</span>
            </div>
            <div class="kpi-card">
              <span class="kpi-title">Estado de Exclusión Mutua</span>
              <span class="kpi-number" style="color:${stateT14.useMutex ? 'var(--neon-emerald)' : 'var(--neon-red)'}; font-size:1.8rem;">
                ${stateT14.useMutex ? 'GARANTIZADA' : 'VIOLADA'}
              </span>
              <span class="kpi-subtext">${stateT14.useMutex ? 'Sección crítica protegida' : 'Intercalación no controlada'}</span>
            </div>
            <div class="kpi-card">
              <span class="kpi-title">Progreso de Instrucciones</span>
              <span class="kpi-number">${stateT14.stepIndex} / 6</span>
              <span class="kpi-subtext">Microinstrucciones despachadas</span>
            </div>
          </div>

          <!-- Auditoría -->
          <div class="audit-terminal">
            <div class="audit-header-tag">Auditoría de Microinstrucciones en Memoria</div>
            <div><strong>Paso Actual:</strong> ${stateT14.lastStepText}</div>
            ${isCorrupt ? `
              <div class="audit-alert-box">
                <strong>CONDICIÓN DE CARRERA CONFIRMADA:</strong> Debido a que el Hilo 2 leyó count (5) antes de que el Hilo 1 depositara su valor incrementado (6), la última escritura del Hilo 2 sobreescribió en la RAM el valor 4. El incremento se perdió por completo.
              </div>
            ` : stateT14.useMutex && stateT14.stepIndex === 6 ? `
              <div class="audit-success-box">
                <strong>SINCRONIZACIÓN EXITOSA:</strong> El Mutex forzó la ejecución atómica de la sección crítica. El valor final en memoria es exactamente 5.
              </div>
            ` : `
              <div style="color:var(--text-muted); margin-top:0.4rem;">
                Avanza con el botón "Paso a Paso" para observar la carga y modificación en los registros R1 y R2.
              </div>
            `}
          </div>
        </div>
      `;
      container.appendChild(panel);
    }

    function demoT14_SinMutex() {
      stateT14.useMutex = false;
      stateT14.stepIndex = 6;
      stateT14.r1 = 6;
      stateT14.r2 = 4;
      stateT14.count = 4;
      stateT14.lastStepText = "Hilo 2 escribe count = 4. ¡Sobreescritura destructiva!";
      renderView();
    }

    function demoT14_ConMutex() {
      stateT14.useMutex = true;
      stateT14.stepIndex = 6;
      stateT14.r1 = 6;
      stateT14.r2 = 5;
      stateT14.count = 5;
      stateT14.lastStepText = "Sección crítica ejecutada con exclusión mutua. RAM consistente (5).";
      renderView();
    }

    function stepT14() {
      if (stateT14.stepIndex < 6) {
        stateT14.stepIndex++;
        const steps = stateT14.useMutex ? microstepsWithMutex : microstepsWithoutMutex;
        const s = steps[stateT14.stepIndex - 1];
        stateT14.lastStepText = s.text;
        stateT14.r1 = s.r1;
        stateT14.r2 = s.r2;
        stateT14.count = s.count;
      }
      renderView();
    }

    function runAllT14() {
      stateT14.stepIndex = 6;
      const steps = stateT14.useMutex ? microstepsWithMutex : microstepsWithoutMutex;
      const s = steps[5];
      stateT14.lastStepText = s.text;
      stateT14.r1 = s.r1;
      stateT14.r2 = s.r2;
      stateT14.count = s.count;
      renderView();
    }

    function resetT14() {
      stateT14.stepIndex = 0;
      stateT14.r1 = 0;
      stateT14.r2 = 0;
      stateT14.count = 5;
      stateT14.lastStepText = "Secuencia reiniciada. count = 5.";
      renderView();
    }

    // --------------------------------------------------------------------------
    // INICIALIZACIÓN
    // --------------------------------------------------------------------------
    document.addEventListener("DOMContentLoaded", () => {
      selectTopic(9);
    });
  </script>
</body>
</html>
